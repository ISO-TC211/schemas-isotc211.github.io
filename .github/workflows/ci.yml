name: ci

on:
  push:
    branches:
      - main
  pull_request:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      force-lutaml-build:
        description: 'Rebuild LXR/SPA packages even if cached'
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 6'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout schemas
        uses: actions/checkout@v6
        with:
          repository: ISO-TC211/schemas
          path: schemas
          fetch-depth: 1

      - name: Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Gem cache
        uses: actions/cache@v4
        with:
          path: schemas/vendor/bundle-lutaml
          key: gems-lutaml-${{ hashFiles('schemas/Gemfile.lock') }}
          restore-keys: gems-lutaml-

      - name: lutaml bundle
        run: |
          cd schemas
          bundle config set --local path vendor/bundle-lutaml
          bundle install

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: LXR/SPA cache
        uses: actions/cache@v4
        with:
          path: |
            build
            site
            configs
          key: lxr-${{ hashFiles('schemas/lxr_packages.yml', 'schemas/ljr_packages.yml', 'scripts/generate_configs.rb') }}-${{ github.sha }}
          restore-keys: |
            lxr-${{ hashFiles('schemas/lxr_packages.yml', 'schemas/ljr_packages.yml', 'scripts/generate_configs.rb') }}-
            lxr-

      - name: lutaml pipelines
        run: make configs lxr-spas
        env:
          FORCE_LUTAML_BUILD: ${{ inputs.force-lutaml-build }}

      - name: Install site deps
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  link_checker:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'repository_dispatch'
    steps:
      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --base 'https://schemas.isotc211.org/'
            --exclude 'https://committee\.iso\.org/'
            --exclude 'https://www\.iso\.org/'
            --exclude 'https://www\.facebook\.com/'
            --exclude 'https://twitter\.com/'
            --exclude 'http://iso\.sparxcloud\.com/'
            --exclude 'https://lutaml\.github\.io/'
            --exclude '%23'
            --exclude '.+/resources/?.*'
            'https://schemas\.isotc211\.org/.*'
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
