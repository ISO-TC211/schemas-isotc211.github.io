lass='strong elementlink' x='5' y='27'>identifier<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The attribute \"identifier\" represents a designator<\/text>\n<text x='5' y='87' class='desc'>that<\/text>\n<text x='5' y='101' class='desc'>is used to uniquely denote that register within the<\/text>\n<text x='5' y='115' class='desc'>set of registers<\/text>\n<text x='5' y='129' class='desc'>maintained by the register owner. In the case of a<\/text>\n<text x='5' y='143' class='desc'>hierarchical<\/text>\n<text x='5' y='157' class='desc'>register, the \"identifier\" of a subregister shall<\/text>\n<text x='5' y='171' class='desc'>uniquely identify<\/text>\n<text x='5' y='185' class='desc'>that subregister within the scope of all registers<\/text>\n<text x='5' y='199' class='desc'>established by<\/text>\n<text x='5' y='213' class='desc'>the owner of the principal register. It shall be<\/text>\n<text x='5' y='227' class='desc'>represented as a<\/text>\n<text x='5' y='241' class='desc'>CharacterString containing a compact and<\/text>\n<text x='5' y='255' class='desc'>human-readable designator.<\/text>\n<text x='5' y='269' class='desc'>EXAMPLE: 'ISO/TC 211 Register of Feature Data<\/text>\n<text x='5' y='283' class='desc'>Dictionaries and<\/text>\n<text x='5' y='297' class='desc'>Feature Catalogues' might be the identifier of the<\/text>\n<text x='5' y='311' class='desc'>principal<\/text>\n<text x='5' y='325' class='desc'>register of a hierarchical register. 'DGIWG FACC<\/text>\n<text x='5' y='339' class='desc'>Data Dictionary'<\/text>\n<text x='5' y='353' class='desc'>and 'IHO S-57 Object Dictionary' might be the<\/text>\n<text x='5' y='367' class='desc'>identifiers of<\/text>\n<text x='5' y='381' class='desc'>subregisters within the hierarchy.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_2' class='box' transform='transla pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>owner<\/text>\n<text class='visible' x='5' y='41'>type: pir:RegisterStakeholder_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The role name owner describes that the<\/text>\n<text x='5' y='87' class='desc'>RegisterStakeholder for the association The role<\/text>\n<text x='5' y='101' class='desc'>name \"owner\"<\/text>\n<text x='5' y='115' class='desc'>identifies the RegisterStakeholder as the owner of<\/text>\n<text x='5' y='129' class='desc'>the<\/text>\n<text x='5' y='143' class='desc'>register.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_7' class='box' transform='translate(455,446)' data-desc-height='56' data-desc-height-rest='56' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>submitter<\/text>\n<text class='visible' x='5' y='41'>type: pir:RegisterStakeholder_PropertyType<\/text>\n<text x='5' y='59'>1..∞<\/text>\n<text x='5' y='73' class='desc'>The role name \"submitter\" identifies the<\/text>\n<text x='5' y='87' class='desc'>RegisterStakeholder as the submitting organization<\/text>\n<text x='5' y='101' class='desc'>to the<\/text>\n<text x='5' y='115' class='desc'>register.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_8' class='box' transform='translate(455,517)' data-desc-height='42' data-desc-height-rest='42' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>containedItem<\/text>\n<text class='visible' x='5' y='41'>type: pir:RegisterItem_PropertyType<\/text>\n<text x='5' y='59'>1..∞<\/text>\n<text x='5' y='73' class='desc'>The role 'containedItem' connects an instance of the<\/text>\n<text x='5' y='87' class='desc'>class Register to one or more instances of<\/text>\n<text x='5' y='101' class='desc'>RegisterItem.<\/text>\n<line class='connection' id='p_1_1_8' x1='-35' y1='-474' x2='-35' y2='-40'/>\n<path class='connection' d='M-35,-40 Q-35,15 0,23'/>\n<\/g>\n\n\n<\/svg>\n","used_by":[]},{"id":"element-pir-register-item","name":"RegisterItem","type":"pir:RegisterItem_Type","min_occurs":null,"max_occurs":null,"occurs":{"min":1,"max":1},"documentation":null,"instance_xml":"<RegisterItem>\n  gco:AbstractObject_Type\n<\/RegisterItem>","source":null,"diagram_svg":"<svg id='svg' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' onload='loadSVG();'>\n\n\n<defs>\n<style type='text/css'><![CDATA[\nsvg {pointer-events: none;}\ntext {font-family: arial; font-size: 11px;}\nline, polyline, polygon {fill: none; stroke: black;}\n\n.strong {font-size: 12px; font-weight: bold;}\n.small {font-size: 10px;}\n.big {font-size: 15px; fill: #882222;}\n\n.button {fill: white; stroke: black; pointer-events: all;}\n.shadow {fill: #ccccd8; stroke: none;}\n.connection {fill: none; stroke: #666666;}\n.empty {fill: none; stroke: black;}\n.filled {fill: black; stroke: none;}\n\n.boxelement, .boxany, .boxattribute1, .boxanyattribute {fill: #FFFFBB; stroke: #776633; pointer-events: all;}\n.boxelementoptional {fill: #FFFFBB; stroke: #776633; pointer-events: all; stroke-dasharray: 2;}\n.boxattribute2 {fill: #FFFFBB; stroke: #776633; pointer-events: all; stroke-dasharray: 2;}\n.boxschema, .boxloop, .boxcompositor {fill: #E7EBF3; stroke: #666677;}\n.boxselector, .boxfield, .boxidc {fill: #E0F7B7; stroke: #667733;}\n\n.lax {fill: white; stroke: black;}\n.skip {fill: #cc6666; stroke: black;}\n.strict {fill: black; stroke: none;}\n\n.border {fill: #f9f9f9; stroke: #dddddd;}\n\n.element ier<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The attribute \"itemIdentifier\" is represented as a<\/text>\n<text x='5' y='87' class='desc'>Character that is used to uniquely denote that item<\/text>\n<text x='5' y='101' class='desc'>within an item<\/text>\n<text x='5' y='115' class='desc'>class and is intended for information processing.<\/text>\n<text x='5' y='129' class='desc'>Once a value has<\/text>\n<text x='5' y='143' class='desc'>been assigned, it shall not be reused. The<\/text>\n<text x='5' y='157' class='desc'>class/identifier union<\/text>\n<text x='5' y='171' class='desc'>shall be unique within the register. NOTE When a<\/text>\n<text x='5' y='185' class='desc'>register contains<\/text>\n<text x='5' y='199' class='desc'>items from different item classes, each item will be<\/text>\n<text x='5' y='213' class='desc'>uniquely<\/text>\n<text x='5' y='227' class='desc'>identifiable by the item identifier alone.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_2' class='box' transform='translate(455,91)' data-desc-height='70' data-desc-height-rest='122' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>status<\/text>\n<text class='visible' x='5' y='41'>type: pir:RE_ItemStatus_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The attribute \"status\" is represented as an instance<\/text>\n<text x='5' y='87' class='desc'>of<\/text>\n<text x='5' y='101' class='desc'>RE_ItemStatus that identifies the registration<\/text>\n<text x='5' y='115' class='desc'>status of the<\/text>\n<text x='5' y='129' class='desc'>RegisterItem.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_3' class='box' transform='translate(455,162)' data-desc-height='42' data-desc-height-rest='76' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>dateTimeAddition<\/text>\n<text class='visible' x='5' y='41'>type: gco:DateTime_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The attribute \"dateTimeAddition\" specifies the date<\/text>\n<text x='5' y='87' class='desc'>on<\/text>\n<text x='5' y='101' class='desc'>which the item was added<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_4' class='box' transform='translate(455,233)' data-desc-height='42' data-desc-height-rest='42' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>dateTimeSupersession<\/text>\n<text class='visible' x='5' y='41'>type: gco:DateTime_PropertyType<\/text>\n<text x='5' y='59'>0..1<\/text>\n<text x='5' y='73' class='desc'>The attribute \"dateTimeSupersession\" specifies the<\/text>\n<text x='5' y='87' class='desc'>date<\/text>\n<text x='5' y='101' class='desc'>and time on which an item has been superseeded. <\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_5' class='box' transform='translate(455,304)' data-desc-height='42' data-desc-height-rest='42' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>dateTimeRetirement<\/text>\n<text class='visible' x='5' y='41'>type: gco:DateTime_PropertyType<\/text>\n<text x='5' y='59'>0..1<\/text>\n<text x='5' y='73' class='desc'>The attribute \"dateTimeRetirement\" specifies the<\/text>\n<text x='5' y='87' class='desc'>date and<\/text>\n<text x='5' y='101' class='desc'>time on which an item has been retired. <\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_6' class='box' transform='translate(455,375)' data-desc-height='42' data-desc-height-rest='42' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>dateTimeInvalidation<\/text>\n<text class='visible' x='5' y='41'>type: gco:DateTime_PropertyType<\/text>\n<text x='5' y='59'>0..1<\/text>\n<text x='5' y='73' class='desc'>The attribute \"dateTimeInvalidation\" specifies the<\/text>\n<text x='5' y='87' class='desc'>date<\/text>\n<text x='5' y='101' class='desc'>and time on which an item has been invalidated. <\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_7' class='box' transform='translate(455,446)' data-desc-height='28' data-desc-height-rest='28' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>itemClass<\/text>\n<text class='visible' x='5' y='41'>type: pir:ItemClass_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The role \"itemClass\" connects an instance of a<\/text>\n<text x='5' y='87' class='desc'>\"RegisterI ext class='strong elementlink' x='5' y='27'>name<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The attribute \"name\" is represented as a<\/text>\n<text x='5' y='87' class='desc'>CharacterString containing a compact and<\/text>\n<text x='5' y='101' class='desc'>human-readable designator<\/text>\n<text x='5' y='115' class='desc'>that is used to denote a class of item. The \"name\"<\/text>\n<text x='5' y='129' class='desc'>that designates<\/text>\n<text x='5' y='143' class='desc'>an item class held in a register that conforms to<\/text>\n<text x='5' y='157' class='desc'>this International<\/text>\n<text x='5' y='171' class='desc'>Standard shall: a) uniquely denote the item class<\/text>\n<text x='5' y='185' class='desc'>within the context<\/text>\n<text x='5' y='199' class='desc'>of the register; and b) be based on the item class<\/text>\n<text x='5' y='213' class='desc'>designation used<\/text>\n<text x='5' y='227' class='desc'>in the applicable technical standard.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_2' class='box' transform='translate(455,91)' data-desc-height='84' data-desc-height-rest='122' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>alternativeName<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The attribute \"alternativeNames\" contains a set of<\/text>\n<text x='5' y='87' class='desc'>instances of RE_AlternativeName, each of which is a<\/text>\n<text x='5' y='101' class='desc'>translation of<\/text>\n<text x='5' y='115' class='desc'>the \"name\" of the RE_ItemClass into a language other<\/text>\n<text x='5' y='129' class='desc'>than the<\/text>\n<text x='5' y='143' class='desc'>\"operatingLanguage\" of the RE_Register.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_3' class='box' transform='translate(455,162)' data-desc-height='84' data-desc-height-rest='84' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>technicalStandard<\/text>\n<text class='visible' x='5' y='41'>type: cit:CI_Citation_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The role “technicalStandard” shall be represented as<\/text>\n<text x='5' y='87' class='desc'>an instance of CI_Citation [ISO 19115-1] that<\/text>\n<text x='5' y='101' class='desc'>specifies the<\/text>\n<text x='5' y='115' class='desc'>technical standard (and the specific portion<\/text>\n<text x='5' y='129' class='desc'>thereof) to which items<\/text>\n<text x='5' y='143' class='desc'>in the item class shall conform.<\/text>\n<line class='connection' id='p_1_1_3' x1='-35' y1='-119' x2='-35' y2='-40'/>\n<path class='connection' d='M-35,-40 Q-35,15 0,23'/>\n<\/g>\n\n\n<\/svg>\n","used_by":[]},{"id":"element-pir-re-locale","name":"RE_Locale","type":"pir:RE_Locale_Type","min_occurs":null,"max_occurs":null,"occurs":{"min":1,"max":1},"documentation":null,"instance_xml":"<RE_Locale>\n  gco:AbstractObject_Type\n<\/RE_Locale>","source":null,"diagram_svg":"<svg id='svg' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' onload='loadSVG();'>\n\n\n<defs>\n<style type='text/css'><![CDATA[\nsvg {pointer-events: none;}\ntext {font-family: arial; font-size: 11px;}\nline, polyline, polygon {fill: none; stroke: black;}\n\n.strong {font-size: 12px; font-weight: bold;}\n.small height-rest='0' data-desc-x='0'>\n<rect class='boxcompositor' x='0' y='8' width='60' height='31' rx='9'/>\n<circle cx='42' cy='14' r='2'/>\n<circle cx='42' cy='23' r='2'/>\n<circle cx='42' cy='32' r='2'/>\n<text class='small' x='30' y='17'>1<\/text>\n<text class='small' x='30' y='26'>2<\/text>\n<text class='small' x='30' y='35'>3<\/text>\n<line x1='42' y1='14' x2='42' y2='32'/>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<use x='59' y='17' xlink:href='#minus' id='s_1_1' onclick='show(\"_1_1\")'/>\n<\/g>\n\n\n<g id='_1_1_1' class='box' transform='translate(455,20)' data-desc-height='308' data-desc-height-rest='308' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>name<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The attribute \"name\" is be represented as a<\/text>\n<text x='5' y='87' class='desc'>CharacterString containing a compact and<\/text>\n<text x='5' y='101' class='desc'>human-readable designator<\/text>\n<text x='5' y='115' class='desc'>that is used to uniquely denote that register within<\/text>\n<text x='5' y='129' class='desc'>the set of<\/text>\n<text x='5' y='143' class='desc'>registers maintained by the register owner. In the<\/text>\n<text x='5' y='157' class='desc'>case of a<\/text>\n<text x='5' y='171' class='desc'>hierarchical register, the \"name\" of a subregister<\/text>\n<text x='5' y='185' class='desc'>shall uniquely<\/text>\n<text x='5' y='199' class='desc'>identify that subregister within the scope EXAMPLE<\/text>\n<text x='5' y='213' class='desc'>'ISO/TC 211<\/text>\n<text x='5' y='227' class='desc'>Register of Feature Data Dictionaries and Feature<\/text>\n<text x='5' y='241' class='desc'>Catalogues' might<\/text>\n<text x='5' y='255' class='desc'>be the name of the principal register of of all<\/text>\n<text x='5' y='269' class='desc'>registers<\/text>\n<text x='5' y='283' class='desc'>established by the owner of the principal register.<\/text>\n<text x='5' y='297' class='desc'>a hierarchical<\/text>\n<text x='5' y='311' class='desc'>register. 'DGIWG FACC Data Dictionary' and 'IHO S-57<\/text>\n<text x='5' y='325' class='desc'>Object<\/text>\n<text x='5' y='339' class='desc'>Dictionary' might be the names of subregisters<\/text>\n<text x='5' y='353' class='desc'>within the<\/text>\n<text x='5' y='367' class='desc'>hierarchy.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_2' class='box' transform='translate(455,91)' data-desc-height='238' data-desc-height-rest='262' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>contentSummary<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The attribute \"contentSummary\" is be represented as<\/text>\n<text x='5' y='87' class='desc'>a<\/text>\n<text x='5' y='101' class='desc'>CharacterString containing a general statement of<\/text>\n<text x='5' y='115' class='desc'>the purpose for<\/text>\n<text x='5' y='129' class='desc'>which items in the register are made available to<\/text>\n<text x='5' y='143' class='desc'>potential users.<\/text>\n<text x='5' y='157' class='desc'>It should also specify any limits to the scope of<\/text>\n<text x='5' y='171' class='desc'>the register and<\/text>\n<text x='5' y='185' class='desc'>identify the types of applications for which the<\/text>\n<text x='5' y='199' class='desc'>items are intended.<\/text>\n<text x='5' y='213' class='desc'>NOTE The scope of a register could be limited by<\/text>\n<text x='5' y='227' class='desc'>theme, by region,<\/text>\n<text x='5' y='241' class='desc'>by language or other criteria. EXAMPLE The scope of<\/text>\n<text x='5' y='255' class='desc'>a terminology<\/text>\n<text x='5' y='269' class='desc'>register could be limited to Spanish terms used to<\/text>\n<text x='5' y='283' class='desc'>describe<\/text>\n<text x='5' y='297' class='desc'>landforms in Latin America. <\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_3' class='box' transform='translate(455,162)' data-desc-height='238' data-desc-height-rest='238' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>uniformResourceIdentifier<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'>1..∞<\/text>\n<text x='5' y='73' class='desc'>The attribute \"uniformResourceIdentifier\" takes as<\/text>\n<text x='5' y='87' class='desc'>its<\/text>\n<text x='5' y='101' class='desc'>value a set of URI's, each referencing information<\/text>\n<text x='5' y='115' class='desc'>about online<\/text>\n<text x='5' y='129' class='desc'>resources associated with the register. EXAMPLE<\/text>\n<text x='5' y='143' class='desc'>'http://www.digest.org/Navigate2.htm' and<\/text>\n<text x='5' y='157' class='desc'>'http://www.epa.gov/opppmsd1/PPISdata/index.html'<\/text>\n<text x='5' y='171' class='desc'>are sample values<\/text>\n<text x='5' y='185' class='desc'>corresponding value of the attribute<\/text>\n<text x='5' y='199' class='desc'>OnLineResource.linkage<\/text>\n<text x='5' y='213' class='desc'>specifies a resource providing access to the<\/text>\n<text x='5' y='227' class='desc'>complete content of the<\/text>\n<text x='5' y='241' class='desc'>register. EXAMPLE<\/text>\n<text x='5' y='255' class='desc'>'http://www.digest.org/Navigate2.htm' and<\/text>\n<text x='5' y='269' class='desc'>'http://www.epa.gov/opppmsd1/PPISdata/index.html'<\/text>\n<text x='5' y='283' class='desc'>are sample values<\/text>\n<text x='5' y='297' class='desc'>of OnLineResource.linkage.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_4' class='box' transform='translate(455,233)' data-desc-height='182' data-desc-height-rest='192' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>operatingLanguage<\/text>\n<text class='visible' x='5' y='41'>type: pir:RE_Locale_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The attribute \"operatingLanguage\" is represented as<\/text>\n<text x='5' y='87' class='desc'>an<\/text>\n<text x='5' y='101' class='desc'>instance of class RE_Locale that is used to specify<\/text>\n<text x='5' y='115' class='desc'>language,<\/text>\n<text x='5' y='129' class='desc'>country information and character encoding for the<\/text>\n<text x='5' y='143' class='desc'>proper<\/text>\n<text x='5' y='157' class='desc'>interpretation of the content of character strings<\/text>\n<text x='5' y='171' class='desc'>in the register.<\/text>\n<text x='5' y='185' class='desc'>The values of all character strings in the register<\/text>\n<text x='5' y='199' class='desc'>shall be in<\/text>\n<text x='5' y='213' class='desc'>accordance with the value of \"operatingLanguage\",<\/text>\n<text x='5' y='227' class='desc'>unless otherwise<\/text>\n<text x='5' y='241' class='desc'>stated.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_5' class='box' transform='translate(455,304)' data-desc-height='350' data-desc-height-rest='350' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>alternativeLanguages<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'>0..1<\/text>\n<text x='5' y='73' class='desc'>The attribute \"alternativeLanguages\" supports<\/text>\n<text x='5' y='87' class='desc'>cultural<\/text>\n<text x='5' y='101' class='desc'>and linguistic adaptability, individual items in a<\/text>\n<text x='5' y='115' class='desc'>register may<\/text>\n<text x='5' y='129' class='desc'>provide elements of information in additional<\/text>\n<text x='5' y='143' class='desc'>languages other than<\/text>\n<text x='5' y='157' class='desc'>the operating language of the register. The<\/text>\n<text x='5' y='171' class='desc'>attribute<\/text>\n<text x='5' y='185' class='desc'>alternativeLanguages shall be represented as a set<\/text>\n<text x='5' y='199' class='desc'>of instances of<\/text>\n<text x='5' y='213' class='desc'>RE_Locale, each specifying an additional unique<\/text>\n<text x='5' y='227' class='desc'>locale used by items<\/text>\n<text x='5' y='241' class='desc'>in the register. Every member of the set shall be<\/text>\n<text x='5' y='255' class='desc'>used by at least<\/text>\n<text x='5' y='269' class='desc'>one item in the register. The locale of every<\/text>\n<text x='5' y='283' class='desc'>alternativeExpression<\/text>\n<text x='5' y='297' class='desc'>used by any item in the register shall be included<\/text>\n<text x='5' y='311' class='desc'>in this set of<\/text>\n<text x='5' y='325' class='desc'>RE_Locales. This attribute provides a summary of<\/text>\n<text x='5' y='339' class='desc'>alternative locales<\/text>\n<text x='5' y='353' class='desc'>used by items in a register. Register owners shall<\/text>\n<text x='5' y='367' class='desc'>specify and<\/text>\n<text x='5' y='381' class='desc'>publish their policy as to whether all or only some<\/text>\n<text x='5' y='395' class='desc'>of the items in<\/text>\n<text x='5' y='409' class='desc'>a register shall have alternative expressions.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_6' class='box' transform='translate(455,375)' data-desc-height='28' data-desc-height-rest='304' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>citation<\/text>\n<text class='visible' x='5' y='41'>type: pir:RE_ReferenceSource_PropertyType<\/text>\n<text x='5' y='59'>0..∞<\/text>\n<text x='5' y='73' class='desc'>The role “citation” identifies reference source for<\/text>\n<text x='5' y='87' class='desc'>one or more items in the RE_Register.<\/text>\n<line class='connection' id='p_1_1_6' x1='-35' y1='-332' x2='-35' y2='-40'/>\n<path class='connection' d='M-35,-40 Q-35,15 0,23'/>\n<\/g>\n\n\n<\/svg>\n","used_by":[]},{"id":"element-pir-re-register-item","name":"RE_RegisterItem","type":"pir:RE_RegisterItem_Type","min_occurs":null,"max_occurs":null,"occurs":{"min":1,"max":1},"documentation":null,"instance_xml":"<RE_RegisterItem>\n  pir:RegisterItem_Type\n<\/RE_RegisterItem>","source":null,"substitution_group":"pir:RegisterItem","diagram_svg":"<svg id='svg' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' onload='loadSVG();'>\n\n\n<defs>\n<style type='text/css'><![CDATA[\nsvg {pointer-events: none;}\ntext {font-family: arial; font-size: 11px;}\nline, polyline, polygon {fill: none; stroke: black;}\n\n.strong {font-size: 12px; font-weight: bold;}\n.small {font-size: 10px;}\n.big {font-size: 15px; fill: #882222;}\n\n.button {fill: white; stroke: black; pointer-events: all;}\n.shadow {fill: #ccccd8; stroke: none;}\n.connection {fill: none; stroke: #666666;}\n.empty {fill: none; stroke: black;}\n.filled {fill: black; stroke: none;}\n\n.boxelement, .boxany, .boxattribute1, .boxanyattribute {fill: #FFFFBB; stroke: #776633; pointer-events: all;}\n.boxelementoptional {fill: #FFFFBB; stroke: #776633; pointer-events: all; stroke-dasharray: 2;}\n.boxattribute2 {fill: #FFFFBB; stroke: #776633; pointer-events: all; stroke-dasharray: 2;}\n.boxschema, .boxloop, .boxcompositor {fill: #E7EBF3; stroke: #666677;}\n.boxselector, .boxfield, .boxidc {fill: #E0F7B7; stroke: #667733;}\n\n.lax {fill: white; stroke: black;}\n.skip {fill: #cc6666; stroke: black;}\n.strict {fill: black; stroke: none;}\n\n.border {fill: #f9f9f9; stroke: #dddddd;}\n\n.elementlink {fill: blue;}\n\n.desc {fill: #888888;}\n]]><\/style>\n  <symbol class='button' id='plus'>\n    <rect x='1' y='1' width='10' height='10'/>\n    <line x1='3' y1='6' x2='9' y2='6'/>\n    <line x1='6' y1='3' x2='6' y2='9'/>\n  <\/symbol>\n  <symbol class='button' id='minus'>\n    <rect x='1' y='1' width='10' height='10'/>\n    <line x1='3' y1='6' x2='9' y2='6'/>\n  <\/symbol>\n\n<\/defs>\n\n\n<g id='_1' class='box' transform='translate(20,20)' data-desc-height='0' data-desc-height-rest='0' data-desc-x='0'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>RE_RegisterItem<\/text>\n<text class='visible' x='5' y='41'>type: pir:RE_RegisterItem_Type<\/text>\n<text x='5' y='59'><\/text>\n<use x='284' y='17' xlink:href='#minus' id='s_1' onclick='show(\"_1\")'/>\n<\/g>\n\n\n<g id='_1_1' class='box' transform='translate(350,20)' data-desc-height='0' data-desc-height-rest='0' data-desc-x='0'>\n<rect class='boxcompositor' x='0' y='8' width='60' height='31' rx='9'/>\n<circle cx='42' cy='14' r='2'/>\n<circle cx='42' cy='23' r='2'/>\n<circle cx='42' cy='32' r='2'/>\n<text class='small' x='30' y='17'>1<\/text>\n<text class='small' x='30' y='26'>2<\/text>\n<text class='small' x='30' y='35'>3<\/text>\n<line x1='42' y1='14' x2='42' y2='32'/>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<use x='59' y='17' xlink:href='#minus' id='s_1_1' onclick='show(\"_1_1\")'/>\n<\/g>\n\n\n<g id='_1_1_1' class='box' transform='translate(455,20)' data-desc-height='294' data-desc-height-rest='294' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>name<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The attribute \"name\" is represented as a<\/text>\n<text x='5' y='87' class='desc'>CharacterString containing a compact and<\/text>\n<text x='5' y='101' class='desc'>human-readable designator<\/text>\n<text x='5' y='115' class='desc'>that is used to denote a register concept. Each<\/text>\n<text x='5' y='129' class='desc'>\"name\" shall: -<\/text>\n<text x='5' y='143' class='desc'>denote an item concept in the scope of an item<\/text>\n<text x='5' y='157' class='desc'>class; and - be a<\/text>\n<text x='5' y='171' class='desc'>succinct expression of the item concept it denotes.<\/text>\n<text x='5' y='185' class='desc'>EXAMPLE 'Lift'<\/text>\n<text x='5' y='199' class='desc'>and 'buoy shape'. The \"name\" shall be unique within<\/text>\n<text x='5' y='213' class='desc'>a register<\/text>\n<text x='5' y='227' class='desc'>according to the following rules: - Multiple items<\/text>\n<text x='5' y='241' class='desc'>of the same item<\/text>\n<text x='5' y='255' class='desc'>class may use the same value for \"name\" but only one<\/text>\n<text x='5' y='269' class='desc'>such item may<\/text>\n<text x='5' y='283' class='desc'>have a status of 'valid'. - Items in different item<\/text>\n<text x='5' y='297' class='desc'>classes may use<\/text>\n<text x='5' y='311' class='desc'>the same value for name. The \"name\" may be used to<\/text>\n<text x='5' y='325' class='desc'>support searches<\/text>\n<text x='5' y='339' class='desc'>for items of interest to a human user of the<\/text>\n<text x='5' y='353' class='desc'>register.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_2' class='box' transform='translate(455,91)' data-desc-height='308' data-desc-height-rest='308' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>definition<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The attribute \"definition\" shall be represented as a<\/text>\n<text x='5' y='87' class='desc'>CharacterString containing the definition of the<\/text>\n<text x='5' y='101' class='desc'>concept embodied by<\/text>\n<text x='5' y='115' class='desc'>that item and expressed in the operating language of<\/text>\n<text x='5' y='129' class='desc'>the register.<\/text>\n<text x='5' y='143' class='desc'>The \"definition\" shall be a precise statement of the<\/text>\n<text x='5' y='157' class='desc'>nature,<\/text>\n<text x='5' y='171' class='desc'>properties, scope or essential qualities of the<\/text>\n<text x='5' y='185' class='desc'>concept as realized<\/text>\n<text x='5' y='199' class='desc'>by the item. If a definition is taken from an<\/text>\n<text x='5' y='213' class='desc'>external source,<\/text>\n<text x='5' y='227' class='desc'>RE_Reference shall be used to provide information<\/text>\n<text x='5' y='241' class='desc'>about that source<\/text>\n<text x='5' y='255' class='desc'>together with the unique identifier of the item in<\/text>\n<text x='5' y='269' class='desc'>the external<\/text>\n<text x='5' y='283' class='desc'>source where available. EXAMPLE 'Equipment<\/text>\n<text x='5' y='297' class='desc'>consisting of a platform,<\/text>\n<text x='5' y='311' class='desc'>which is often enclosed, that is raised and lower ed<\/text>\n<text x='5' y='325' class='desc'>in a vertical<\/text>\n<text x='5' y='339' class='desc'>shaft to transport humans, equipment or materials; a<\/text>\n<text x='5' y='353' class='desc'>lift or (U.S.)<\/text>\n<text x='5' y='367' class='desc'>elevator' and 'The shape of a buoy'.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_3' class='box' transform='translate(455,162)' data-desc-height='154' data-desc-height-rest='262' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>alternativeExpressions<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'>0..1<\/text>\n<text x='5' y='73' class='desc'>The attribute \"alternativeExpressions\" represents as<\/text>\n<text x='5' y='87' class='desc'>a<\/text>\n<text x='5' y='101' class='desc'>set of instances of RE_AlternativeExpression, each<\/text>\n<text x='5' y='115' class='desc'>specifying an<\/text>\n<text x='5' y='129' class='desc'>alternative name and optionally additional<\/text>\n<text x='5' y='143' class='desc'>information in a locale<\/text>\n<text x='5' y='157' class='desc'>different from that of the register. No two<\/text>\n<text x='5' y='171' class='desc'>instances of<\/text>\n<text x='5' y='185' class='desc'>RE_AlternativeExpression within the set shall have<\/text>\n<text x='5' y='199' class='desc'>the same value<\/text>\n<text x='5' y='213' class='desc'>for locale. <\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_4' class='box' transform='translate(455,233)' data-desc-height='84' data-desc-height-rest='216' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>dateAccepted<\/text>\n<text class='visible' x='5' y='41'>type: gco:Date_PropertyType<\/text>\n<text x='5' y='59'>0..1<\/text>\n<text x='5' y='73' class='desc'>The conditional attribute \"dateAccepted\" specifies<\/text>\n<text x='5' y='87' class='desc'>the<\/text>\n<text x='5' y='101' class='desc'>date on which a proposal to add the item to the<\/text>\n<text x='5' y='115' class='desc'>register was<\/text>\n<text x='5' y='129' class='desc'>accepted. DateAccepted =<\/text>\n<text x='5' y='143' class='desc'>self.additionInformation.dateDisposed<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_5' class='box' transform='translate(455,304)' data-desc-height='84' data-desc-height-rest='170' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>dateAmended<\/text>\n<text class='visible' x='5' y='41'>type: gco:Date_PropertyType<\/text>\n<text x='5' y='59'>0..1<\/text>\n<text x='5' y='73' class='desc'>The conditional attribute \"dateAmended\" specifies<\/text>\n<text x='5' y='87' class='desc'>the<\/text>\n<text x='5' y='101' class='desc'>date on which a proposal to supersede or retire the<\/text>\n<text x='5' y='115' class='desc'>item was<\/text>\n<text x='5' y='129' class='desc'>accepted. DataAmended =<\/text>\n<text x='5' y='143' class='desc'>self.amendmentInformation.dateDisposed<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_6' class='box' transform='translate(455,375)' data-desc-height='252' data-desc-height-rest='252' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>description<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'>0..1<\/text>\n<text x='5' y='73' class='desc'>The attribute \"description\" is represented as a<\/text>\n<text x='5' y='87' class='desc'>CharacterString containing a description of the<\/text>\n<text x='5' y='101' class='desc'>concept embodied by<\/text>\n<text x='5' y='115' class='desc'>that item and expressed in the operating language of<\/text>\n<text x='5' y='129' class='desc'>the register.<\/text>\n<text x='5' y='143' class='desc'>The \"description\" contains a statement of the<\/text>\n<text x='5' y='157' class='desc'>nature, properties,<\/text>\n<text x='5' y='171' class='desc'>scope, or non-essential qualities of the concept<\/text>\n<text x='5' y='185' class='desc'>that are realized<\/text>\n<text x='5' y='199' class='desc'>by the item but are not specified by the<\/text>\n<text x='5' y='213' class='desc'>\"definition\" element.<\/text>\n<text x='5' y='227' class='desc'>EXAMPLE 1 'A lift may be moved through a system of<\/text>\n<text x='5' y='241' class='desc'>overhead cables,<\/text>\n<text x='5' y='255' class='desc'>lateral traction or under-floor hydraulics.' EXAMPLE<\/text>\n<text x='5' y='269' class='desc'>2 'Buoy shape<\/text>\n<text x='5' y='283' class='desc'>is generally based on the portion visible above the<\/text>\n<text x='5' y='297' class='desc'>water<\/text>\n<text x='5' y='311' class='desc'>line.'<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_7' class='box' transform='translate(455,446)' data-desc-height='154' data-desc-height-rest='206' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>fieldOfApplication<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'>0..1<\/text>\n<text x='5' y='73' class='desc'>The attribute \"fieldOfApplication\" is represented as<\/text>\n<text x='5' y='87' class='desc'>a<\/text>\n<text x='5' y='101' class='desc'>set of instances of RE_FieldOfApplication, each of<\/text>\n<text x='5' y='115' class='desc'>which shall<\/text>\n<text x='5' y='129' class='desc'>describe a kind of use of the item. The<\/text>\n<text x='5' y='143' class='desc'>fieldOfApplication may be<\/text>\n<text x='5' y='157' class='desc'>used as the basis for creating metadata for<\/text>\n<text x='5' y='171' class='desc'>submission to search<\/text>\n<text x='5' y='185' class='desc'>engines. EXAMPLES 'Agricultural Production' and<\/text>\n<text x='5' y='199' class='desc'>'Marine<\/text>\n<text x='5' y='213' class='desc'>Navigation'.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_8' class='box' transform='translate(455,517)' data-desc-height='56' data-desc-height-rest='160' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' co:CharacterString_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The attribute \"identifier\" represents a designator<\/text>\n<text x='5' y='87' class='desc'>that<\/text>\n<text x='5' y='101' class='desc'>is used to uniquely denote that register within the<\/text>\n<text x='5' y='115' class='desc'>set of registers<\/text>\n<text x='5' y='129' class='desc'>maintained by the register owner. In the case of a<\/text>\n<text x='5' y='143' class='desc'>hierarchical<\/text>\n<text x='5' y='157' class='desc'>register, the \"identifier\" of a subregister shall<\/text>\n<text x='5' y='171' class='desc'>uniquely identify<\/text>\n<text x='5' y='185' class='desc'>that subregister within the scope of all registers<\/text>\n<text x='5' y='199' class='desc'>established by<\/text>\n<text x='5' y='213' class='desc'>the owner of the principal register. It shall be<\/text>\n<text x='5' y='227' class='desc'>represented as a<\/text>\n<text x='5' y='241' class='desc'>CharacterString containing a compact and<\/text>\n<text x='5' y='255' class='desc'>human-readable designator.<\/text>\n<text x='5' y='269' class='desc'>EXAMPLE: 'ISO/TC 211 Register of Feature Data<\/text>\n<text x='5' y='283' class='desc'>Dictionaries and<\/text>\n<text x='5' y='297' class='desc'>Feature Catalogues' might be the identifier of the<\/text>\n<text x='5' y='311' class='desc'>principal<\/text>\n<text x='5' y='325' class='desc'>register of a hierarchical register. 'DGIWG FACC<\/text>\n<text x='5' y='339' class='desc'>Data Dictionary'<\/text>\n<text x='5' y='353' class='desc'>and 'IHO S-57 Object Dictionary' might be the<\/text>\n<text x='5' y='367' class='desc'>identifiers of<\/text>\n<text x='5' y='381' class='desc'>subregisters within the hierarchy.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_2' class='box' transform='translate(455,91)' data-desc-height='70' data-desc-height-rest='276' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>version<\/text>\n<text class='visible' x='5' y='41'>type: pir:RE_Version_PropertyType<\/text>\n<text x='5' y='59'>0..1<\/text>\n<text x='5' y='73' class='desc'>The conditional attribute \"version\" is represented<\/text>\n<text x='5' y='87' class='desc'>as an<\/text>\n<text x='5' y='101' class='desc'>instance of class RE_Version that specifies a unique<\/text>\n<text x='5' y='115' class='desc'>state in the<\/text>\n<text x='5' y='129' class='desc'>life of the register. <\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_3' class='box' transform='translate(455,162)' data-desc-height='84' data-desc-height-rest='230' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>dateOfLastChange<\/text>\n<text class='visible' x='5' y='41'>type: gco:Date_PropertyType<\/text>\n<text x='5' y='59'>0..1<\/text>\n<text x='5' y='73' class='desc'>The conditional attribute \"dateOfLastChange\" is<\/text>\n<text x='5' y='87' class='desc'>represented as an instance of the class .LT. Date<\/text>\n<text x='5' y='101' class='desc'>.GT. [ISO 19103]<\/text>\n<text x='5' y='115' class='desc'>and specifies the (full precision) date of the most<\/text>\n<text x='5' y='129' class='desc'>recent change to<\/text>\n<text x='5' y='143' class='desc'>the status of an item in the register was made.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_4' class='box' transform='translate(455,233)' data-desc-height='56' data-desc-height-rest='184' da ='5' y='41'>type: pir:RegisterStakeholder_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The role name owner describes that the<\/text>\n<text x='5' y='87' class='desc'>RegisterStakeholder for the association The role<\/text>\n<text x='5' y='101' class='desc'>name \"owner\"<\/text>\n<text x='5' y='115' class='desc'>identifies the RegisterStakeholder as the owner of<\/text>\n<text x='5' y='129' class='desc'>the<\/text>\n<text x='5' y='143' class='desc'>register.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_7' class='box' transform='translate(455,446)' data-desc-height='56' data-desc-height-rest='56' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>submitter<\/text>\n<text class='visible' x='5' y='41'>type: pir:RegisterStakeholder_PropertyType<\/text>\n<text x='5' y='59'>1..∞<\/text>\n<text x='5' y='73' class='desc'>The role name \"submitter\" identifies the<\/text>\n<text x='5' y='87' class='desc'>RegisterStakeholder as the submitting organization<\/text>\n<text x='5' y='101' class='desc'>to the<\/text>\n<text x='5' y='115' class='desc'>register.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_8' class='box' transform='translate(455,517)' data-desc-height='42' data-desc-height-rest='42' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>containedItem<\/text>\n<text class='visible' x='5' y='41'>type: pir:RegisterItem_PropertyType<\/text>\n<text x='5' y='59'>1..∞<\/text>\n<text x='5' y='73 xt>\n<line x1='42' y1='14' x2='42' y2='32'/>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<use x='59' y='17' xlink:href='#minus' id='s_1_1' onclick='show(\"_1_1\")'/>\n<\/g>\n\n\n<g id='_1_1_1' class='box' transform='translate(455,20)' data-desc-height='168' data-desc-height-rest='168' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>name<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The attribute \"name\" is represented as a<\/text>\n<text x='5' y='87' class='desc'>CharacterString containing a compact and<\/text>\n<text x='5' y='101' class='desc'>human-readable designator<\/text>\n<text x='5' y='115' class='desc'>that is used to denote a class of item. The \"name\"<\/text>\n<text x='5' y='129' class='desc'>that designates<\/text>\n<text x='5' y='143' class='desc'>an item class held in a register that conforms to<\/text>\n<text x='5' y='157' class='desc'>this International<\/text>\n<text x='5' y='171' class='desc'>Standard shall: a) uniquely denote the item class<\/text>\n<text x='5' y='185' class='desc'>within the context<\/text>\n<text x='5' y='199' class='desc'>of the register; and b) be based on the item class<\/text>\n<text x='5' y='213' class='desc'>designation used<\/text>\n<text x='5' y='227' class='desc'>in the applicable technical standard.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_2' class='box' transform='translate(455,91)' data-desc-height='84' data-desc-height-rest='122' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https:/ 01' class='desc'>human-readable designator<\/text>\n<text x='5' y='115' class='desc'>that is used to denote a register concept. Each<\/text>\n<text x='5' y='129' class='desc'>\"name\" shall: -<\/text>\n<text x='5' y='143' class='desc'>denote an item concept in the scope of an item<\/text>\n<text x='5' y='157' class='desc'>class; and - be a<\/text>\n<text x='5' y='171' class='desc'>succinct expression of the item concept it denotes.<\/text>\n<text x='5' y='185' class='desc'>EXAMPLE 'Lift'<\/text>\n<text x='5' y='199' class='desc'>and 'buoy shape'. The \"name\" shall be unique within<\/text>\n<text x='5' y='213' class='desc'>a register<\/text>\n<text x='5' y='227' class='desc'>according to the following rules: - Multiple items<\/text>\n<text x='5' y='241' class='desc'>of the same item<\/text>\n<text x='5' y='255' class='desc'>class may use the same value for \"name\" but only one<\/text>\n<text x='5' y='269' class='desc'>such item may<\/text>\n<text x='5' y='283' class='desc'>have a status of 'valid'. - Items in different item<\/text>\n<text x='5' y='297' class='desc'>classes may use<\/text>\n<text x='5' y='311' class='desc'>the same value for name. The \"name\" may be used to<\/text>\n<text x='5' y='325' class='desc'>support searches<\/text>\n<text x='5' y='339' class='desc'>for items of interest to a human user of the<\/text>\n<text x='5' y='353' class='desc'>register.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_2' class='box' transform='translate(455,91)' data-desc-height='308' data-desc-height-rest='308' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>definition<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The attribute \"definition\" shall be represented as a<\/text>\n<text x='5' y='87' class='desc'>CharacterString containing the definition of the<\/text>\n<text x='5' y='101' class='desc'>concept embodied by<\/text>\n<text x='5' y='115' class='desc'>that item and expressed in the operating language of<\/text>\n<text x='5' y='129' class='desc'>the register.<\/text>\n<text x='5' y='143' class='desc'>The \"definition\" shall be a precise statement of the<\/text>\n<text x='5' y='157' class='desc'>nature,<\/text>\n<text x='5' y='171' class='desc'>properties, scope or essential qualities of the<\/text>\n<text x='5' y='185' class='desc'>concept as realized<\/text>\n<text x='5' y='199' class='desc'>by the item. If a definition is taken from an<\/text>\n<text x='5' y='213' class='desc'>external source,<\/text>\n<text x='5' y='227' class='desc'>RE_Reference shall be used to provide information<\/text>\n<text x='5' y='241' class='desc'>about that source<\/text>\n<text x='5' y='255' class='desc'>together with the unique identifier of the item in<\/text>\n<text x='5' y='269' class='desc'>the external<\/text>\n<text x='5' y='283' class='desc'>source where available. EXAMPLE 'Equipment<\/text>\n<text x='5' y='297' class='desc'>consisting of a platform,<\/text>\n<text x='5' y='311' class='desc'>which is often enclosed, that is raised and lower ed<\/text>\n<text x='5' y='325' class='desc'>in a vertical<\/text>\n<text x='5' y='339' class='desc'>shaft to transport humans, equipment or materials; a<\/text>\n<text x='5' y='353' class='desc'>lift or (U.S.)<\/text>\n<text x='5' y='367' class='desc'>elevator' and 'The shape of a buoy'.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_3' class='box' transform='translate(455,162)' data-desc-height='154' data-desc-height-rest='262' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>alternativeExpressions<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'>0..1<\/text>\n<text x='5' y='73' class='desc'>The attribute \"alternativeExpressions\" represents as<\/text>\n<text x='5' y='87' class='desc'>a<\/text>\n<text x='5' y='101' class='desc'>set of instances of RE_AlternativeExpression, each<\/text>\n<text x='5' y='115' class='desc'>specifying an<\/text>\n<text x='5' y='129' class='desc'>alternative name and optionally additional<\/text>\n<text x='5' y='143' class='desc'>information in a locale<\/text>\n<text x='5' y='157' class='desc'>different from that of the register. No two<\/text>\n<text x='5' y='171' class='desc'>instances of<\/text>\n<text x='5' y='185' class='desc'>RE_AlternativeExpression within the set shall have<\/text>\n<text x='5' y='199' class='desc'>the same value<\/text>\n<text x='5' y='213' class='desc'>for locale. <\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_4' class='box' transform='translate(455,233)' data-desc-height='84' data-desc-height-rest='216' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>dateAccepted<\/text>\n<text class='visible' x='5' y='41'>type: gco:Date_PropertyType<\/text>\n<text x='5' y='59'>0..1<\/text>\n<text x='5' y='73' class='desc'>The conditional attribute \"dateAccepted\" specifies<\/text>\n<text x='5' y='87' class='desc'>the<\/text>\n<text x='5' y='101' class='desc'>date on which a proposal to add the item to the<\/text>\n<text x='5' y='115' class='desc'>register was<\/text>\n<text x='5' y='129' class='desc'>accepted. DateAccepted =<\/text>\n<text x='5' y='143' class='desc'>self.additionInformation.dateDisposed<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_5' class='box' transform='translate(455,304)' data-desc-height='84' data-desc-height-rest='170' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>dateAmended<\/text>\n<text class='visible' x='5' y='41'>type: gco:Date_PropertyType<\/text>\n<text x='5' y='59'>0..1<\/text>\n<text x='5' y='73' class='desc'>The conditional attribute \"dateAmended\" specifies<\/text>\n<text x='5' y='87' class='desc'>the<\/text>\n<text x='5' y='101' class='desc'>date on which a proposal to supersede or retire the<\/text>\n<text x='5' y='115' class='desc'>item was<\/text>\n<text x='5' y='129' class='desc'>accepted. DataAmended =<\/text>\n<text x='5' y='143' class='desc'>self.amendmentInformation.dateDisposed<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_6' class='box' transform='translate(455,375)' data-desc-height='252' data-desc-height-rest='252' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>description<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'>0..1<\/text>\n<text x='5' y='73' class='desc'>The attribute \"description\" is represented as a<\/text>\n<text x='5' y='87' class='desc'>CharacterString containing a description of the<\/text>\n<text x='5' y='101' class='desc'>concept embodied by<\/text>\n<text x='5' y='115' class='desc'>that item and expressed in the operating language of<\/text>\n<text x='5' y='129' class='desc'>the register.<\/text>\n<text x='5' y='143' class='desc'>The \"description\" contains a statement of the<\/text>\n<text x='5' y='157' class='desc'>nature, properties,<\/text>\n<text x='5' y='171' class='desc'>scope, or non-essential qualities of the concept<\/text>\n<text x='5' y='185' class='desc'>that are realized<\/text>\n<text x='5' y='199' class='desc'>by the item but are not specified by the<\/text>\n<text x='5' y='213' class='desc'>\"definition\" element.<\/text>\n<text x='5' y='227' class='desc'>EXAMPLE 1 'A lift may be moved through a system of<\/text>\n<text x='5' y='241' class='desc'>overhead cables,<\/text>\n<text x='5' y='255' class='desc'>lateral traction or under-floor hydraulics.' EXAMPLE<\/text>\n<text x='5' y='269' class='desc'>2 'Buoy shape<\/text>\n<text x='5' y='283' class='desc'>is generally based on the portion visible above the<\/text>\n<text x='5' y='297' class='desc'>water<\/text>\n<text x='5' y='311' class='desc'>line.'<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_7' class='box' transform='translate(455,446)' data-desc-height='154' data-desc-height-rest='206' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>fieldOfApplication<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'>0..1<\/text>\n<text x='5' y='73' class='desc'>The attribute \"fieldOfApplication\" is represented as<\/text>\n<text x='5' y='87' class='desc'>a<\/text>\n<text x='5' y='101' class='desc'>set of instances of RE_FieldOfApplication, each of<\/text>\n<text x='5' y='115' class='desc'>which shall<\/text>\n<text x='5' y='129' class='desc'>describe a kind of use of the item. The<\/text>\n<text x='5' y='143' class='desc'>fieldOfApplication may be<\/text>\n<text x='5' y='157' class='desc'>used as the basis for creating metadata for<\/text>\n<text x='5' y='171' class='desc'>submission to search<\/text>\n<text x='5' y='185' class='desc'>engines. EXAMPLES 'Agricultural Production' and<\/text>\n<text x='5' y='199' class='desc'>'Marine<\/text>\n<text x='5' y='213' class='desc'>Navigation'.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_8' class='box' transform='translate(455,517)' data-desc-height='56' data-desc-height-rest='160' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>additionInformation<\/text>\n<text class='visible' x='5' y='41'>type: pir:RE_AdditionInformation_PropertyType<\/text>\n<text x='5' y='59'>1..∞<\/text>\n<text x='5' y='73' class='desc'>The role \"additionInformation\" identifies the class<\/text>\n<text x='5' y='87' class='desc'>RE_AdditionInformation for addtional information<\/text>\n<text x='5' y='101' class='desc'>about the<\/text>\n<text x='5' y='115' class='desc'>registerItem.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_9' class='box' transform='translate(455,588)' data-desc-height='56' data-desc-height-rest='114' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='291' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='291' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>amendmentInformation<\/text>\n<text class='visible' x='5' y='41'>type: pir:RE_AmendmentInformation_PropertyType<\/text>\n<text x='5' y='59'>0..∞<\/text>\n<t e<\/text>\n<text x='5' y='59'><\/text>\n<use x='284' y='17' xlink:href='#minus' id='s_1' onclick='show(\"_1\")'/>\n<\/g>\n\n\n<g id='_1_1' class='box' transform='translate(350,20)' data-desc-height='0' data-desc-height-rest='0' data-desc-x='0'>\n<rect class='boxcompositor' x='0' y='8' width='60' height='31' rx='9'/>\n<circle cx='42' cy='14' r='2'/>\n<circle cx='42' cy='23' r='2'/>\n<circle cx='42' cy='32' r='2'/>\n<text class='small' x='30' y='17'>1<\/text>\n<text class='small' x='30' y='26'>2<\/text>\n<text class='small' x='30' y='35'>3<\/text>\n<line x1='42' y1='14' x2='42' y2='32'/>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<use x='59' y='17' xlink:href='#minus' id='s_1_1' onclick='show(\"_1_1\")'/>\n<\/g>\n\n\n<g id='_1_1_1' class='box' transform='translate(455,20)' data-desc-height='308' data-desc-height-rest='308' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>name<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The attribute \"name\" is be represented as a<\/text>\n<text x='5' y='87' class='desc'>CharacterString containing a compact and<\/text>\n<text x='5' y='101' class='desc'>human-readable designator<\/text>\n<text x='5' y='115' class='desc'>that is used to uniquely denote that register within<\/text>\n<text x='5' y='129' class='desc'>the set of<\/text>\n<text x='5' y='143' class='desc'>registers maintained by the register owner. In the<\/text>\n<text x='5' y='157' class='desc'>case of a<\/text>\n<text x='5' y='171' class='desc'>hierarchical register, the \"name\" of a subregister<\/text>\n<text x='5' y='185' class='desc'>shall uniquely<\/text>\n<text x='5' y='199' class='desc'>identify that subregister within the scope EXAMPLE<\/text>\n<text x='5' y='213' class='desc'>'ISO/TC 211<\/text>\n<text x='5' y='227' class='desc'>Register of Feature Data Dictionaries and Feature<\/text>\n<text x='5' y='241' class='desc'>Catalogues' might<\/text>\n<text x='5' y='255' class='desc'>be the name of the principal register of of all<\/text>\n<text x='5' y='269' class='desc'>registers<\/text>\n<text x='5' y='283' class='desc'>established by the owner of the principal register.<\/text>\n<text x='5' y='297' class='desc'>a hierarchical<\/text>\n<text x='5' y='311' class='desc'>register. 'DGIWG FACC Data Dictionary' and 'IHO S-57<\/text>\n<text x='5' y='325' class='desc'>Object<\/text>\n<text x='5' y='339' class='desc'>Dictionary' might be the names of subregisters<\/text>\n<text x='5' y='353' class='desc'>within the<\/text>\n<text x='5' y='367' class='desc'>hierarchy.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_2' class='box' transform='translate(455,91)' data-desc-height='238' data-desc-height-rest='262' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>contentSummary<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The attribute \"contentSummary\" is be represented as<\/text>\n<text x='5' y='87' class='desc'>a<\/text>\n<text x='5' y='101' class='desc'>CharacterString containing a general statement of<\/text>\n<text x='5' y='115' class='desc'>the purpose for<\/text>\n<text x='5' y='129' class='desc'>which items in the register are made available to<\/text>\n<text x='5' y='143' class='desc'>potential users.<\/text>\n<text x='5' y='157' class='desc'>It should also specify any limits to the scope of<\/text>\n<text x='5' y='171' class='desc'>the register and<\/text>\n<text x='5' y='185' class='desc'>identify the types of applications for which the<\/text>\n<text x='5' y='199' class='desc'>items are intended.<\/text>\n<text x='5' y='213' class='desc'>NOTE The scope of a register could be limited by<\/text>\n<text x='5' y='227' class='desc'>theme, by region,<\/text>\n<text x='5' y='241' class='desc'>by language or other criteria. EXAMPLE The scope of<\/text>\n<text x='5' y='255' class='desc'>a terminology<\/text>\n<text x='5' y='269' class='desc'>register could be limited to Spanish terms used to<\/text>\n<text x='5' y='283' class='desc'>describe<\/text>\n<text x='5' y='297' class='desc'>landforms in Latin America. <\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_3' class='box' transform='translate(455,162)' data-desc-height='238' data-desc-height-rest='238' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>uniformResourceIdentifier<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'>1..∞<\/text>\n<text x='5' y='73' class='desc'>The attribute \"uniformResourceIdentifier\" takes as<\/text>\n<text x='5' y='87' class='desc'>its<\/text>\n<text x='5' y='101' class='desc'>value a set of URI's, each referencing information<\/text>\n<text x='5' y='115' class='desc'>about online<\/text>\n<text x='5' y='129' class='desc'>resources associated with the register. EXAMPLE<\/text>\n<text x='5' y='143' class='desc'>'http://www.digest.org/Navigate2.htm' and<\/text>\n<text x='5' y='157' class='desc'>'http://www.epa.gov/opppmsd1/PPISdata/index.html'<\/text>\n<text x='5' y='171' class='desc'>are sample values<\/text>\n<text x='5' y='185' class='desc'>corresponding value of the attribute<\/text>\n<text x='5' y='199' class='desc'>OnLineResource.linkage<\/text>\n<text x='5' y='213' class='desc'>specifies a resource providing access to the<\/text>\n<text x='5' y='227' class='desc'>complete content of the<\/text>\n<text x='5' y='241' class='desc'>register. EXAMPLE<\/text>\n<text x='5' y='255' class='desc'>'http://www.digest.org/Navigate2.htm' and<\/text>\n<text x='5' y='269' class='desc'>'http://www.epa.gov/opppmsd1/PPISdata/index.html'<\/text>\n<text x='5' y='283' class='desc'>are sample values<\/text>\n<text x='5' y='297' class='desc'>of OnLineResource.linkage.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_4' class='box' transform='translate(455,233)' data-desc-height='182' data-desc-height-rest='192' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>operatingLanguage<\/text>\n<text class='visible' x='5' y='41'>type: pir:RE_Locale_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The attribute \"operatingLanguage\" is represented as<\/text>\n<text x='5' y='87' class='desc'>an<\/text>\n<text x='5' y='101' class='desc'>instance of class RE_Locale that is used to specify<\/text>\n<text x='5' y='115' class='desc'>language,<\/text>\n<text x='5' y='129' class='desc'>country information and character encoding for the<\/text>\n<text x='5' y='143' class='desc'>proper<\/text>\n<text x='5' y='157' class='desc'>interpretation of the content of character strings<\/text>\n<text x='5' y='171' class='desc'>in the register.<\/text>\n<text x='5' y='185' class='desc'>The values of all character strings in the register<\/text>\n<text x='5' y='199' class='desc'>shall be in<\/text>\n<text x='5' y='213' class='desc'>accordance with the value of \"operatingLanguage\",<\/text>\n<text x='5' y='227' class='desc'>unless otherwise<\/text>\n<text x='5' y='241' class='desc'>stated.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_5' class='box' transform='translate(455,304)' data-desc-height='350' data-desc-height-rest='350' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>alternativeLanguages<\/text>\n<text class='visible' x='5' y='41'>type: gco:CharacterString_PropertyType<\/text>\n<text x='5' y='59'>0..1<\/text>\n<text x='5' y='73' class='desc'>The attribute \"alternativeLanguages\" supports<\/text>\n<text x='5' y='87' class='desc'>cultural<\/text>\n<text x='5' y='101' class='desc'>and linguistic adaptability, individual items in a<\/text>\n<text x='5' y='115' class='desc'>register may<\/text>\n<text x='5' y='129' class='desc'>provide elements of information in additional<\/text>\n<text x='5' y='143' class='desc'>languages other than<\/text>\n<text x='5' y='157' class='desc'>the operating language of the register. The<\/text>\n<text x='5' y='171' class='desc'>attribute<\/text>\n<text x='5' y='185' class='desc'>alternativeLanguages shall be represented as a set<\/text>\n<text x='5' y='199' class='desc'>of instances of<\/text>\n<text x='5' y='213' class='desc'>RE_Locale, each specifying an additional unique<\/text>\n<text x='5' y='227' class='desc'>locale used by items<\/text>\n<text x='5' y='241' class='desc'>in the register. Every member of the set shall be<\/text>\n<text x='5' y='255' class='desc'>used by at least<\/text>\n<text x='5' y='269' class='desc'>one item in the register. The locale of every<\/text>\n<text x='5' y='283' class='desc'>alternativeExpression<\/text>\n<text x='5' y='297' class='desc'>used by any item in the register shall be included<\/text>\n<text x='5' y='311' class='desc'>in this set of<\/text>\n<text x='5' y='325' class='desc'>RE_Locales. This attribute provides a summary of<\/text>\n<text x='5' y='339' class='desc'>alternative locales<\/text>\n<text x='5' y='353' class='desc'>used by items in a register. Register owners shall<\/text>\n<text x='5' y='367' class='desc'>specify and<\/text>\n<text x='5' y='381' class='desc'>publish their policy as to whether all or only some<\/text>\n<text x='5' y='395' class='desc'>of the items in<\/text>\n<text x='5' y='409' class='desc'>a register shall have alternative expressions.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_6' class='box' transform='translate(455,375)' data-desc-height='28' data-desc-height-rest='304' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelementoptional' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>citation<\/text>\n<text class='visible' x='5' y='41'>type: pir:RE_ReferenceSource_PropertyType<\/text>\n<text x='5' y='59'>0..∞<\/text>\n<text x='5' y='73' class='desc'>The role “citation” identifies reference source for<\/text>\n<text x='5' y='87' class='desc'>one or more items in the RE_Register.<\/text>\n<line class='connection' id='p_1_1_6' x1='-35' y1='-332' x2='-35' y2='-40'/>\n<path class='connection' d='M-35,-40 Q-35,15 0,23'/>\n<\/g>\n\n\n<\/svg>\n","used_by":[{"name":"RE_Register","kind":"element","schema":"pir"}]},{"id":"type-pir-re-similarity-to-source-property-type","name":"RE_SimilarityToSource_PropertyType","base":null,"content_model":"sequence","abstract":false,"mixed":false,"attributes":[{"name":"gco:nilReason (ref)","type":null,"use":"optional","default":null,"fixed":null,"documentation":null}],"elements":[],"choice":null,"sequence":{"id":null,"occurs":{"min":"0","max":1} ion; and .LT. letters .GT. (one or more<\/text>\n<text x='5' y='353' class='desc'>characters) shall<\/text>\n<text x='5' y='367' class='desc'>optionally specify the minor subversion designation.<\/text>\n<text x='5' y='381' class='desc'>EXAMPLE<\/text>\n<text x='5' y='395' class='desc'>'2.1a'.<\/text>\n<line class='connection' x1='-35' y1='23' x2='0' y2='23'/>\n<\/g>\n\n\n\n<g id='_1_1_2' class='box' transform='translate(455,91)' data-desc-height='84' data-desc-height-rest='290' data-desc-x='455'>\n<rect class='shadow' x='3' y='3' width='285' height='46'/>\n<rect class='boxelement' x='0' y='0' width='285' height='46'/>\n<text class='visible' x='5' y='13'>https://schemas.isotc211.org/19135/-1/pir/1.0<\/text>\n<text class='strong elementlink' x='5' y='27'>versionDate<\/text>\n<text class='visible' x='5' y='41'>type: gco:Date_PropertyType<\/text>\n<text x='5' y='59'><\/text>\n<text x='5' y='73' class='desc'>The attribute \"versionDate\" is represented as an<\/text>\n<text x='5' y='87' class='desc'>instance of the class .LT. Date .GT. [ISO 19103]<\/text>\n<text x='5' y='101' class='desc'>that specifies the<\/text>\n<text x='5' y='115' class='desc'>date (which may be of reduced precision) of the<\/text>\n<text x='5' y='129' class='desc'>version. EXAMPLE<\/text>\n<text x='5' y='143' class='desc'>2002-10-21.<\/text>\n<line class='connection' id='p_1_1_2' x1='-35' y1='-48' x2='-35' y2='-40'/>\n<path class='connection' d='M-35,-40 Q-35,15 0,23'/>\n<\/g>\n\n\n<\/svg>\n","used_by":[{"name":"RE_Version","kind":"element","schema":"pir"}]},{"id":"type-pir-subregister-description-property-type","name":"SubregisterDescription_PropertyType","base":null,"content_model":"sequence","abstract":false,"mixed":false,"attributes":[{"name":"gco:nilReason (ref)","type":null,"use":"optional","default":null,"fixed":null,"documentation":null}],"elements":[],"choice":null,"sequence":{"id":null,"occurs":{"min":"0","max":1},"documentation":null,"sequences":[],"elements":[{"name":"pir:SubregisterDes
